<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Đăng Ký Thành Viên CLB Yêu Nhạc</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <form id="form1" name="form1" action="#" method="post">
    <table cellpadding="4" border="1" width="500" cellspacing="0">
      <caption>ĐĂNG KÝ THÀNH VIÊN CLB YÊU NHẠC</caption>

      <tr>
        <td>Họ tên</td>
        <td>
          <input
            type="text"
            id="txtHoTen"
            name="txtHoTen"
            class="mytextbox"
            placeholder="Nhập họ và tên"
            required
          />
        </td>
      </tr>

      <tr>
        <td>Tên đăng nhập</td>
        <td>
          <input
            type="text"
            id="txtUserName"
            name="txtUserName"
            class="mytextbox"
            placeholder="Nhập tên đăng nhập"
            required
          />
        </td>
      </tr>

      <tr>
        <td>Mật khẩu</td>
        <td>
          <input
            type="password"
            id="txtPass"
            name="txtPass"
            class="mytextbox"
            placeholder="Nhập mật khẩu"
            required
          />
        </td>
      </tr>

      <tr>
        <td>Gõ lại mật khẩu</td>
        <td>
          <input
            type="password"
            id="txtRepass"
            name="txtRepass"
            class="mytextbox"
            placeholder="Nhập lại mật khẩu"
            required
          />
        </td>
      </tr>

      <tr>
        <td>Giới tính</td>
        <td>
          <label>
            <input type="radio" id="rdNam" name="rdGioiTinh" value="0" checked /> Nam
          </label>
          <label>
            <input type="radio" id="rdNu" name="rdGioiTinh" value="1" /> Nữ
          </label>
        </td>
      </tr>

      <tr>
        <td>Ngoại ngữ</td>
        <td>
          <label>
            <input type="checkbox" id="chkAnh" name="chkNgoaiNgu" value="Anh văn" /> Anh văn
          </label>
          <label>
            <input type="checkbox" id="chkPhap" name="chkNgoaiNgu" value="Pháp văn" /> Pháp văn
          </label>
          <label>
            <input type="checkbox" id="chkHoa" name="chkNgoaiNgu" value="Hoa văn" /> Hoa văn
          </label>
        </td>
      </tr>

      <tr>
        <td>Nghề nghiệp</td>
        <td>
          <select id="cboNgheNghiep" name="cboNgheNghiep" class="mytextbox">
            <option value="0">Bạn làm nghề gì</option>
            <option value="1">Học sinh - Sinh viên</option>
            <option value="2">Giáo viên</option>
            <option value="3">Nhân viên</option>
          </select>
        </td>
      </tr>

      <tr>
        <td>Độ tuổi trung bình</td>
        <td>
          <input
            type="number"
            id="numDoTuoi"
            name="numDoTuoi"
            class="mytextbox"
            min="18"
            max="45"
            value="20"
          />
        </td>
      </tr>

      <tr>
        <td>Thành phố</td>
        <td>
          <input
            type="text"
            id="txtThanhPho"
            name="txtThanhPho"
            class="mytextbox"
            list="danhSachThanhPho"
            placeholder="Chọn hoặc nhập thành phố"
          />
          <datalist id="danhSachThanhPho">
            <option value="TP. Hồ Chí Minh"></option>
            <option value="Hà Nội"></option>
            <option value="Đà Nẵng"></option>
            <option value="Cần Thơ"></option>
            <option value="Hải Phòng"></option>
            <option value="Tây Ninh"></option>
            <option value="Đà Lạt"></option>
            <option value="Huế"></option>
          </datalist>
        </td>
      </tr>

      <tr>
        <td>Hình</td>
        <td>
          <input
            type="file"
            id="fHinh"
            name="fHinh"
            class="mytextbox"
            accept="image/*"
          />
        </td>
      </tr>

      <tr>
        <td>Sở thích</td>
        <td>
          <textarea
            id="txtSoThich"
            name="txtSoThich"
            class="mytextbox"
            placeholder="Nhập sở thích âm nhạc của bạn..."
          ></textarea>
        </td>
      </tr>

      <tr>
        <td colspan="2" align="center" class="action-row">
          <input type="submit" id="btnDangKy" name="btnDangKy" value="Đăng ký" />
          <input type="reset" id="btnXoa" name="btnXoa" value="Làm lại" />
          <input type="hidden" id="NgayDangKy" name="NgayDangKy" value="03/23/2023" />
        </td>
      </tr>
    </table>
  </form>
</body>
</html>
